name: archdiff

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: archdiff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PAGES_URL: https://awalther28.github.io/archdiff-demo

jobs:
  permissions-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the base ref is checked out into a worktree so both
          # sides are extracted by the same tool version in the same run.
          fetch-depth: 0

      - name: Analyse permission changes
        id: archdiff
        uses: awalther28/archdiff/.github/actions/analyze@main
        with:
          base-ref: ${{ github.base_ref }}
          viewer: 'true'
          viewer-base: /archdiff-demo/

      - name: Publish the visual diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          DIST: ${{ steps.archdiff.outputs.viewer-dist }}
          OUT: .archdiff-out
        run: |
          set -euo pipefail
          SRC="$PWD/$OUT"
          STAGE="$RUNNER_TEMP/pages"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Retry: concurrent PR runs push to the same branch, and losing that
          # race must not fail a review comment.
          for attempt in 1 2 3 4 5; do
            rm -rf "$STAGE"; mkdir -p "$STAGE"; cd "$STAGE"
            git init -q
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add origin "$REMOTE"
            # Start from the published site when it exists, so other PRs' data
            # survives; otherwise this is the first publish.
            if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
              git checkout -q FETCH_HEAD
            fi
            git checkout -q -B gh-pages

            # The app is republished every run so it can never drift from the
            # data shape it has to render. One directory per PR, overwritten.
            rsync -a --delete --exclude data "$DIST"/ ./
            mkdir -p "data/pr/$PR"
            cp "$SRC/base.graph.json" "$SRC/head.graph.json" "$SRC/diff.json" "data/pr/$PR/"
            touch .nojekyll

            git add -A
            if git diff --cached --quiet; then
              echo "pages content unchanged"; break
            fi
            git commit -qm "archdiff: visual diff for PR #$PR"
            if git push -q origin gh-pages; then
              echo "published data/pr/$PR"; break
            fi
            echo "push race on attempt $attempt; retrying"
            sleep $(( attempt * 3 ))
          done

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SEVERITY: ${{ steps.archdiff.outputs.severity }}
          VERDICT: ${{ steps.archdiff.outputs.verdict }}
        run: |
          set -euo pipefail
          MARKER='<!-- archdiff -->'
          LINK="$PAGES_URL/#/pr/$PR"
          {
            echo "$MARKER"
            if [ "$SEVERITY" = "NONE" ]; then
              echo "**No permission changes.** The permission graphs are semantically identical."
            else
              echo "**$SEVERITY** — $VERDICT"
            fi
            echo
            echo "[View the permission diff →]($LINK)"
          } > /tmp/comment.md

          # One sticky comment per PR, updated in place. A new comment on every
          # push would bury the finding under its own history.
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                 --jq "[.[] | select(.body | startswith(\"$MARKER\"))] | first | .id // empty")
          if [ -n "$ID" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@/tmp/comment.md >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@/tmp/comment.md >/dev/null
          fi
          echo "commented: $LINK"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archdiff-${{ github.event.pull_request.number }}
          path: .archdiff-out/
          if-no-files-found: ignore
